<div id="content">
<div id="contact-new" data-signals="{
                          first: '',
                          last: '',
                          email: '',
                          phone: ''
                        }"
>
</div>
<div>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" data-bind="email" placeholder="Email"/>
</div>
<div>
    <label for="first">First Name</label>
    <input id="first" name="first" type="text" data-bind="first" placeholder="First Name"/>
</div>
<div>
    <label for="last">Last Name</label>
    <input id="last" name="last" type="text" data-bind="last" placeholder="Last Name"/>
</div>
<div>
    <label for="phone">Phone</label>
    <input id="phone" name="phone" type="email" data-bind="phone" placeholder="Phone"/>
</div>
<div>
    <button data-on-click="@post('/contact/create-new')">
        Save
    </button>
</div>
</div>
