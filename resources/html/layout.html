<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact App</title>
<!--    <link rel="stylesheet" href="https://unpkg.com/missing.css@1.1.3" type="text/css">-->
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.0-beta.11/bundles/datastar.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#0f0f0f',
                        surface: '#1c1c1c',
                        accent: '#3B82F6',         // blue-500
                        'accent-hover': '#2563EB'  // blue-600
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-background text-white min-h-screen flex items-center justify-center">
<main class="w-full max-w-xl p-6 bg-surface rounded-xl shadow-lg space-y-6">
    <header class="flex items-center justify-between mb-6">
        <!-- Left: Text content -->
        <div>
            <h1 class="text-3xl font-bold uppercase tracking-widest text-accent">
                contacts.app
            </h1>
            <p class="text-lg text-gray-400">A Demo Contacts Application</p>
        </div>

        <!-- Right: Image -->
        <img src="https://data-star.dev/static/images/rocket.png"
             alt="Rocket"
             width="64"
             height="64"
             class="ml-4"/>
    </header>
    <div id="content">
        {% block content %}
        {% endblock %}
    </div>
</main>
</body>
</html>
